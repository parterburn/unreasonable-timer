name: CI

on:
  push:
  workflow_dispatch:

jobs:
  engine-tests:
    name: Engine tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  app:
    name: Build and test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project UnreasonableTimer.xcodeproj \
            -scheme UnreasonableTimer \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
      - name: Chime sounds are in the app
        run: |
          for sound in singing-bowl-zero singing-bowl-warning marimba-zero marimba-warning; do
            ls -l "build/Build/Products/Debug/Unreasonable Timer.app/Contents/Resources/$sound.m4a" || exit 1
          done
      - name: Test
        run: |
          set -o pipefail
          # No -quiet: the summary lines show how many tests actually ran, since a bundle that
          # finds zero tests would otherwise pass silently.
          xcodebuild test \
            -project UnreasonableTimer.xcodeproj \
            -scheme UnreasonableTimer \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | grep -E "Executed [0-9]+ tests|error:|\*\* TEST"
      - name: Archive and sign the way release.sh does (ad hoc)
        run: |
          set -o pipefail
          # Same unsigned, universal archive as scripts/release.sh, then the same signing
          # procedure with an ad hoc identity. Only the certificate and notarization differ.
          xcodebuild archive \
            -project UnreasonableTimer.xcodeproj \
            -scheme UnreasonableTimer \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/Release.xcarchive \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
          archived="$(find build/Release.xcarchive/Products -maxdepth 3 -name '*.app' -type d | head -n 1)"
          echo "Archived app: $archived"
          [ -n "$archived" ]
          mkdir -p signing-test
          ditto "$archived" "signing-test/Unreasonable Timer.app"
          echo "--- architectures ---"
          lipo -archs "signing-test/Unreasonable Timer.app/Contents/MacOS/Unreasonable Timer"
          echo "--- nested code ---"
          find "signing-test/Unreasonable Timer.app/Contents/Frameworks" -maxdepth 6 \( -name '*.xpc' -o -name '*.app' -o -name '*.framework' -o -name Autoupdate \) | sort
          echo "--- signing ---"
          scripts/sign-app.sh "signing-test/Unreasonable Timer.app" -
      - name: Sparkle tools are where release.sh looks
        run: |
          for tool in generate_appcast generate_keys; do
            found="$(find build/SourcePackages -type f -name "$tool" -perm -u+x | head -n 1)"
            echo "$tool: ${found:-MISSING}"
            [ -n "$found" ] || exit 1
          done
      - name: Sparkle dry run (key setup, DMG, signed appcast)
        timeout-minutes: 8
        run: |
          set -euo pipefail

          # A throwaway keychain, unlocked and set as the default, so Sparkle's tools can store
          # and read their key without a prompt on a headless runner.
          KEYCHAIN="$RUNNER_TEMP/ci.keychain-db"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"

          # The real setup script: creates a key and writes its public half into project.yml.
          cp project.yml project.yml.orig
          DERIVED_DATA=build scripts/setup-sparkle.sh
          KEY="$(awk '/SUPublicEDKey:/ { print $2; exit }' project.yml)"
          echo "public key: $KEY"
          cp project.yml.orig project.yml

          GEN_KEYS="$(find build/SourcePackages -type f -name generate_keys -perm -u+x | head -n 1)"
          GEN_APPCAST="$(find build/SourcePackages -type f -name generate_appcast -perm -u+x | head -n 1)"
          "$GEN_KEYS" -x "$RUNNER_TEMP/sparkle-key"

          # The app inside the DMG must carry the matching public key; changing its Info.plist
          # invalidates the signature, so sign again.
          APP="signing-test/Unreasonable Timer.app"
          /usr/libexec/PlistBuddy -c "Set :SUPublicEDKey $KEY" "$APP/Contents/Info.plist"
          scripts/sign-app.sh "$APP" - > /dev/null

          VERSION="$(awk '/MARKETING_VERSION:/ { gsub(/"/, "", $2); print $2; exit }' project.yml)"
          BUILD="$(awk '/CURRENT_PROJECT_VERSION:/ { gsub(/"/, "", $2); print $2; exit }' project.yml)"
          mkdir -p dmg-test updates-test
          cp -R "$APP" dmg-test/
          ln -s /Applications dmg-test/Applications
          hdiutil create -volname "Unreasonable Timer" -srcfolder dmg-test -ov -format UDZO updates-test/UnreasonableTimer-$VERSION.dmg
          cp "release-notes/$VERSION.md" "updates-test/UnreasonableTimer-$VERSION.md"

          # The same arguments and clean-up as release.sh.
          "$GEN_APPCAST" \
            --download-url-prefix "https://example.com/releases/v$VERSION/" \
            --maximum-deltas 0 \
            --embed-release-notes \
            --ed-key-file "$RUNNER_TEMP/sparkle-key" \
            updates-test
          xcrun swift scripts/fix-appcast.swift updates-test/appcast.xml unreasonable/timer
          cat updates-test/appcast.xml

          for expected in \
            'sparkle:edSignature' \
            "<sparkle:version>$BUILD</sparkle:version>" \
            "sparkle:shortVersionString>$VERSION" \
            'sparkle:minimumSystemVersion>14.0' \
            "https://github.com/unreasonable/timer/releases/download/v$VERSION/UnreasonableTimer-$VERSION.dmg"; do
            grep -q "$expected" updates-test/appcast.xml || { echo "The appcast is missing: $expected"; exit 1; }
          done
          if grep -q "sparkle:deltas" updates-test/appcast.xml; then echo "The appcast still has deltas"; exit 1; fi
          echo "Sparkle dry run passed"
      - name: Launch smoke test
        run: |
          APP="build/Build/Products/Debug/Unreasonable Timer.app"
          mkdir -p smoke

          is_running() { pgrep -f "Unreasonable Timer.app/Contents/MacOS" >/dev/null; }
          wait_for_launch() {
            for _ in $(seq 1 30); do is_running && return 0; sleep 1; done
            return 1
          }

          open "$APP"
          wait_for_launch || { echo "App did not launch"; exit 1; }
          sleep 4
          screencapture -x smoke/1-setup.png || true

          # A link starts a 20-second timer with lead and warning text.
          open "untimer://start?time=20&lead=Intro&text=Wrap%20up&done=All%20done"
          sleep 6
          is_running || { echo "App died after the link"; exit 1; }
          screencapture -x smoke/2-running.png || true

          sleep 10   # about 4 seconds left: warning state
          screencapture -x smoke/3-warning.png || true

          sleep 8    # past zero: overtime
          screencapture -x smoke/4-overtime.png || true
          is_running || { echo "App died during the countdown"; exit 1; }

          log show --last 3m --style compact --predicate 'process == "Unreasonable Timer"' > smoke/app.log 2>&1 || true
          osascript -e 'tell application "Unreasonable Timer" to quit' || true
          sleep 2

          if ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i "unreasonable"; then
            echo "A crash report was written"
            cat ~/Library/Logs/DiagnosticReports/*nreasonable* | head -80
            exit 1
          fi
          echo "Smoke test passed"
      - name: Upload smoke test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: smoke/
          if-no-files-found: ignore
