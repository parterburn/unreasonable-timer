name: CI

on:
  push:
  workflow_dispatch:

jobs:
  engine-tests:
    name: Engine tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  app:
    name: Build and test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project UnreasonableTimer.xcodeproj \
            -scheme UnreasonableTimer \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project UnreasonableTimer.xcodeproj \
            -scheme UnreasonableTimer \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
