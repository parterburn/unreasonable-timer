name: Screenshots

# Captures the app in each timer state and commits the images to docs/screenshots/app on the
# same branch. Runs on demand, or on a push whose commit message contains [screenshots].
on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  screenshots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screenshots]')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -o pipefail
          brew install xcodegen
          xcodegen generate
          xcodebuild build \
            -project UnreasonableTimer.xcodeproj \
            -scheme UnreasonableTimer \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
      - name: Capture
        run: scripts/ci-screenshots.sh "build/Build/Products/Debug/Unreasonable Timer.app" docs/screenshots/app
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/app
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update app screenshots [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1
