name: Screenshots

# Captures the app in each timer state and commits the images to docs/screenshots/app on the
# same branch. Runs on demand, or on a push whose commit message contains [screenshots].
on:
  workflow_dispatch:
  push:

permissions:
  contents: write

# A newer push replaces an older run, so stale screenshots never land on top of newer ones.
concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screenshots]')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -o pipefail
          brew install xcodegen
          xcodegen generate
          xcodebuild build \
            -project UnreasonableTimer.xcodeproj \
            -scheme UnreasonableTimer \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
      - name: Capture
        run: scripts/ci-screenshots.sh "build/Build/Products/Debug/Unreasonable Timer.app" docs/screenshots/app
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Lay this run's images onto the branch as it is now, rather than rebasing (binary
          # files can't be merged if another commit touched them meanwhile).
          cp -R docs/screenshots/app "$RUNNER_TEMP/shots"
          for attempt in 1 2 3; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            rm -rf docs/screenshots/app
            mkdir -p docs/screenshots
            cp -R "$RUNNER_TEMP/shots" docs/screenshots/app
            git add -A docs/screenshots/app
            if git diff --cached --quiet; then echo "No changes"; exit 0; fi
            git commit -q -m "Update app screenshots [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1
      - name: Checks
        run: |
          # Behaviour checks from the capture run (committed beside the images above).
          cat docs/screenshots/app/checks.txt
          ! grep -q '^FAIL' docs/screenshots/app/checks.txt
